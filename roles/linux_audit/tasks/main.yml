---
- name: Toon systeeminformatie
  ansible.builtin.debug:
    msg:
      - "Hostname: {{ ansible_hostname }}"
      - "OS: {{ ansible_distribution }}"
      - "Version: {{ ansible_distribution_version }}"
      - "Kernel: {{ ansible_kernel }}"

- name: Controleer uptime
  ansible.builtin.command: uptime -p
  register: system_uptime
  changed_when: false
  when: audit_check_uptime

- name: Toon uptime
  ansible.builtin.debug:
    var: system_uptime.stdout
  when: audit_check_uptime

- name: Controleer diskruimte
  ansible.builtin.command: df -h /
  register: disk_usage
  changed_when: false
  when: audit_check_disk

- name: Toon diskruimte
  ansible.builtin.debug:
    var: disk_usage.stdout
  when: audit_check_disk

- name: Controleer geheugen
  ansible.builtin.command: free -h
  register: memory_usage
  changed_when: false
  when: audit_check_memory

- name: Toon geheugen
  ansible.builtin.debug:
    var: memory_usage.stdout
  when: audit_check_memory

---
- name: Update APT package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Apache
  become: true
  ansible.builtin.apt:
    name: "{{ apache_package }}"
    state: present

- name: Ensure Apache is running
  become: true
  ansible.builtin.service:
    name: "{{ apache_service }}"
    state: "{{ apache_state }}"
    enabled: "{{ apache_enabled }}"

- name: Check Apache HTTP response
  ansible.builtin.uri:
    url: http://127.0.0.1/
    status_code: 200
  register: apache_response

- name: Display Apache status
  ansible.builtin.debug:
    msg: "Apache HTTP status: {{ apache_response.status }}"

- name: Deploy custom Apache homepage
  become: true
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="nl">
      <head>
        <meta charset="UTF-8">
        <title>DICTU Ansible Lab</title>
      </head>
      <body>
        <h1>DICTU Ansible Lab</h1>
        <p>Deze server wordt beheerd met Ansible AWX.</p>
      </body>
      </html>
  notify: Restart Apache

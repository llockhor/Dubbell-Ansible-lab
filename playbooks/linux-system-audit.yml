---
- name: Dubbell - Linux System Audit
  hosts: linux
  become: yes
  gather_facts: yes

  tasks:
    - name: Controleer hostname
      ansible.builtin.debug:
        msg: "Hostname: {{ ansible_hostname }}"

    - name: Controleer Linux-distributie
      ansible.builtin.debug:
        msg: "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Controleer uptime
      ansible.builtin.command: uptime
      register: uptime_result
      changed_when: false

    - name: Toon uptime
      ansible.builtin.debug:
        msg: "{{ uptime_result.stdout }}"

    - name: Controleer schijfruimte
      ansible.builtin.command: df -h /
      register: disk_result
      changed_when: false

    - name: Toon schijfruimte
      ansible.builtin.debug:
        msg: "{{ disk_result.stdout }}"

    - name: Controleer geheugen
      ansible.builtin.command: free -h
      register: memory_result
      changed_when: false

    - name: Toon geheugen
      ansible.builtin.debug:
        msg: "{{ memory_result.stdout }}"


---
- name: DICTU - Linux connectivity test
  hosts: linux
  gather_facts: true

  tasks:
    - name: Controleer SSH verbinding
      ansible.builtin.ping:

    - name: Toon servernaam
      ansible.builtin.debug:
        msg: "Server: {{ ansible_hostname }}"

    - name: Toon Linux distributie
      ansible.builtin.debug:
        msg: >-
          {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    - name: Toon IP-adres
      ansible.builtin.debug:
        msg: "{{ ansible_default_ipv4.address }}"
